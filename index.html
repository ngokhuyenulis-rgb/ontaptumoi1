<style>

:root[data-theme=dark]{--bg:#2a1a0f;--card:#3a2415;--ink:#fff1d0;--mut:#d3b48f;--y2:#5a4310;--p2:#5a2a38;--ln:#5a4026;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--y);display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--y);z-index:10}
.logo{font-weight:800;font-size:28px;color:#4A2C17;letter-spacing:-1px;display:flex;align-items:center;gap:6px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--p);display:inline-block;margin-top:8px}
nav{display:flex;gap:6px;margin-left:auto}
nav button{border:0;background:transparent;color:#4A2C17;font:600 14px/1.2 'Be Vietnam Pro',system-ui,sans-serif;padding:8px 14px;border-radius:20px;cursor:pointer}
nav button.on{background:#4A2C17;color:#FFE9A3}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:16px}
h2{margin:0 0 8px;font-size:15px}.mut{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:18px;padding:4px 12px;font:600 13px/1.2 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#4A2C17}
.btn{border:0;border-radius:12px;padding:10px 18px;font:600 15px/1.2 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer;background:var(--y);color:#4A2C17}
.btn.alt{background:var(--p2);color:var(--ink)}.btn.ghost{background:transparent;border:1.5px solid var(--ln);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{perspective:900px;margin:10px auto;max-width:520px;height:280px;cursor:pointer}
.card>div{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip>div{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:2px solid var(--y);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:6px 6px 0 var(--y)}
.back{transform:rotateY(180deg);border-color:var(--p);box-shadow:6px 6px 0 var(--p)}
.big{font-size:84px;line-height:1.1;font-weight:600}.py{font-size:26px;color:var(--p)}.hv{font-size:20px;font-weight:800;margin:4px 0}
.prog{height:8px;background:var(--y2);border-radius:5px;overflow:hidden}.prog b{display:block;height:100%;background:var(--p);transition:width .3s}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{text-align:left;border:2px solid var(--ln);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit;font-size:17px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--y)}.opt.ok{background:#d8f1df;border-color:var(--ok);color:#1d4d2b}.opt.bad{background:var(--p2);border-color:var(--bad);color:#7a1f30}
.q{font-size:44px;font-weight:600;text-align:center;margin:12px 0}.q.sm{font-size:24px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mut)}td.h{font-size:22px;font-weight:600}.hide{background:var(--y2);color:transparent;cursor:pointer;border-radius:6px;user-select:none}
input[type=search],select{font:inherit;padding:9px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--card);color:var(--ink)}
.score{font-size:56px;font-weight:800;text-align:center;color:var(--p)}
.wrap{overflow-x:auto}
@media(max-width:520px){nav{margin-left:0;width:100%}.big{font-size:64px}}
@media(prefers-reduced-motion:reduce){.card>div{transition:none}}
</style></head><body>

function list(){const v=$("#view");
v.innerHTML=`<div class="panel"><div class="row"><input type="search" id="sq" placeholder="Tìm chữ Hán, pinyin, nghĩa…" style="flex:1;min-width:180px">
${[["p","pinyin"],["h","Hán Việt"],["m","nghĩa"]].map(x=>`<label class="row" style="gap:4px"><input type="checkbox" data-k="${x[0]}" ${hid[x[0]]?"checked":""}>Ẩn ${x[1]}</label>`).join("")}</div>
<p class="mut">Ô bị ẩn: chạm vào để xem đáp án.</p><div class="wrap"><table><thead><tr><th>Chữ Hán</th><th>Pinyin</th><th>Hán Việt</th><th>Nghĩa</th><th>Bài</th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
const draw=()=>{const q=$("#sq").value.trim().toLowerCase();
$("#tb").innerHTML=pool().filter(d=>!q||(d.z+d.p+d.h+d.m).toLowerCase().includes(q)).map(d=>`<tr><td class="h zh">${d.z}</td>${["p","h","m"].map(k=>`<td class="${hid[k]?"hide":""}">${d[k]}</td>`).join("")}<td class="mut">${d.l}</td></tr>`).join("")};
draw();$("#sq").oninput=draw;
v.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{hid[c.dataset.k]=c.checked;draw()});
$("#tb").onclick=e=>{if(e.target.classList.contains("hide"))e.target.classList.remove("hide")}}
/* ---- trắc nghiệm ---- */
const T={z2m:["Chữ Hán → Nghĩa","z","m"],z2p:["Chữ Hán → Pinyin","z","p"],z2h:["Chữ Hán → Hán Việt","z","h"],m2z:["Nghĩa → Chữ Hán","m","z"],h2z:["Hán Việt → Chữ Hán","h","z"]};
let qs=[],qi=0,sc=0,wrong=[],lastCfg={t:"mix",n:"20"};
function quizSetup(){const c=lastCfg,n=pool().length;
$("#view").innerHTML=`<div class="panel"><h2>Thiết lập bài trắc nghiệm</h2><div class="row" style="margin:10px 0">
<select id="qt"><option value="mix">Trộn tất cả dạng</option>${Object.entries(T).map(([k,v])=>`<option value="${k}" ${c.t==k?"selected":""}>${v[0]}</option>`).join("")}</select>
<select id="qn">${[10,20,30,50].map(x=>`<option ${c.n==x?"selected":""}>${x}</option>`).join("")}<option value="all" ${c.n=="all"?"selected":""}>Tất cả (${n})</option></select>
<button class="btn" id="go">Bắt đầu</button></div><p class="mut">Mỗi câu có 4 đáp án. Câu sai sẽ được tổng hợp ở cuối để ôn lại.</p></div>`;
$("#go").onclick=()=>{lastCfg={t:$("#qt").value,n:$("#qn").value};start(pool())}}
function mk(d,t){const [,f,a]=T[t];const ans=d[a];
const ds=sh(D.filter(x=>x[a]!==ans&&x.i!==d.i)).reduce((r,x)=>r.some(y=>y[a]===x[a])?r:[...r,x],[]).slice(0,3);
return{d,t,f,a,ans,o:sh([ans,...ds.map(x=>x[a])])}}
function start(src){const keys=Object.keys(T);let p=sh(src);if(lastCfg.n!="all")p=p.slice(0,+lastCfg.n);
qs=p.map(d=>mk(d,lastCfg.t=="mix"?keys[Math.random()*keys.length|0]:lastCfg.t));qi=0;sc=0;wrong=[];ask()}
function ask(){if(qi>=qs.length)return done();const q=qs[qi];
$("#view").innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="mut">${T[q.t][0]}</span><span class="mut">Câu ${qi+1}/${qs.length} · đúng ${sc}</span></div>
<div class="prog" style="margin-top:8px"><b style="width:${qi/qs.length*100}%"></b></div>
<div class="q ${q.f=="z"?"zh":"sm"}">${q.d[q.f]}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt ${q.a=="z"?"zh":""}" data-k="${k}">${o}</button>`).join("")}</div><div id="fb"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const right=q.o[b.dataset.k]===q.ans;
document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(q.o[x.dataset.k]===q.ans)x.classList.add("ok")});
if(right)sc++;else{b.classList.add("bad");wrong.push(q.d)}
$("#fb").innerHTML=`<p><b class="zh">${q.d.z}</b> · ${q.d.p} · ${q.d.h} · ${q.d.m}</p><button class="btn" id="nq">${qi+1<qs.length?"Câu tiếp":"Xem kết quả"}</button>`;
$("#nq").focus();$("#nq").onclick=()=>{qi++;ask()}})}
function done(){const pc=Math.round(sc/qs.length*100),w=[...new Map(wrong.map(d=>[d.i,d])).values()];
$("#view").innerHTML=`<div class="panel"><div class="score">${sc}/${qs.length}</div><p style="text-align:center">${pc>=80?"Rất tốt, bạn nhớ khá chắc rồi!":pc>=50?"Khá ổn, ôn thêm các từ sai nhé.":"Cần ôn thêm – thử lại bằng thẻ ghi nhớ."}</p>
<div class="row" style="justify-content:center"><button class="btn" id="rt">Làm lại</button>${w.length?`<button class="btn alt" id="rw">Ôn ${w.length} từ sai</button>`:""}<button class="btn ghost" id="bk">Thiết lập mới</button></div></div>
${w.length?`<div class="panel"><h2>Các từ làm sai</h2><div class="wrap"><table>${w.map(d=>`<tr><td class="h zh">${d.z}</td><td>${d.p}<br><b>${d.h}</b></td><td>${d.m}</td></tr>`).join("")}</table></div></div>`:""}`;
$("#rt").onclick=()=>start(pool());$("#bk").onclick=quizSetup;if(w.length)$("#rw").onclick=()=>{const c=lastCfg.n;lastCfg.n="all";start(w);lastCfg.n=c}}
chips();go(true);
</script></body></html>
